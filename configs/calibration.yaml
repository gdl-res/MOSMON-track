project:
  name: mosmon_larvae_behaviour
  random_seed: 42

input:
  video_extensions: [".mp4", ".mov", ".m4v", ".avi", ".mkv"]
  recursive: true

# Same detector/tracker settings as eval.yaml so the measured throughput is
# representative of a real evaluation run. The only differences are a capped
# frame budget and disabled debug-video / FAIR hashing so we isolate the
# per-frame detection+tracking+postprocess throughput.
model:
  paths: []
  imgsz: 1920
  conf: 0.15
  iou: 0.7
  device: "auto"
  half: true
  classes: null
  agnostic_nms: true

tracker:
  type: botsort
  yaml: configs/tracker_botsort.yaml
  persist: true
  max_gap_frames: 15
  min_track_length_frames: 10
  min_mean_confidence: 0.10

video:
  frame_stride: 2
  max_frames: 1500          # processed frames per video (amortises model load)
  save_debug_video: false
  save_tracking_video: false
  save_heatmap_video: false

calibration:
  enabled: false

postprocess:
  interpolate_gaps: true
  interpolation_max_gap_frames: 15
  smoothing: savgol
  smoothing_window_frames: 9
  smoothing_polyorder: 2
  remove_outlier_jumps: true
  max_speed_px_s: null

regions:
  border_margin_fraction: 0.10
  center_roi_fraction: 0.50

heatmaps:
  bins_x: 128
  bins_y: 72
  normalize: probability
  per_class: true

features:
  compute_pairwise: true
  pairwise_max_tracks_per_frame: 300
  nearest_neighbor_k: 1
  activity_speed_threshold_px_s: 5.0
  freezing_speed_threshold_px_s: 1.0
  burst_speed_quantile: 0.90

reports:
  make_html: true
  make_markdown: true
  save_plots: true

fair:
  enabled: false
