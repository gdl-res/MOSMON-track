# Registry of YOLO11 detection models to use for tracking / comparison.
# Add one entry per trained model. `path` may be absolute or relative to repo root.
# `classes` is optional documentation of the model's class index -> name mapping;
# the pipeline always trusts model.names at runtime (see metadata.canonical_species).
models:
  - name: yolo11x_overlap_tiling
    path: weights/mosmon_yolov11x_overlap_tiling_best_v1.pt
    notes: >-
      Released weight (download separately; see README). YOLO11x fine-tuned on
      overlapping 640px tiles (training/), imgsz 640, 128 epochs, dfl 1.5, as recorded
      in the checkpoint's train_args.
      Pairs naturally with model.tiling.enabled=true for native-res inference.
